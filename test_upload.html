<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Upload Image</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #667eea;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #5568d3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .image-preview {
            max-width: 200px;
            margin-top: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Test Upload Image Produit</h1>
    
    <form id="productForm">
        <div class="form-group">
            <label for="code_produit">Code Produit:</label>
            <input type="text" id="code_produit" name="code_produit" required>
        </div>
        
        <div class="form-group">
            <label for="nom">Nom:</label>
            <input type="text" id="nom" name="nom" required>
        </div>
        
        <div class="form-group">
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="3"></textarea>
        </div>
        
        <div class="form-group">
            <label for="prix_achat">Prix Achat:</label>
            <input type="number" id="prix_achat" name="prix_achat" step="0.01">
        </div>
        
        <div class="form-group">
            <label for="prix_vente">Prix Vente:</label>
            <input type="number" id="prix_vente" name="prix_vente" step="0.01">
        </div>
        
        <div class="form-group">
            <label for="image">Image:</label>
            <input type="file" id="image" name="image" accept="image/*">
        </div>
        
        <button type="submit">Créer Produit</button>
    </form>
    
    <div id="result" class="result"></div>
    
    <script>
        document.getElementById('productForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData();
            formData.append('code_produit', document.getElementById('code_produit').value);
            formData.append('nom', document.getElementById('nom').value);
            formData.append('description', document.getElementById('description').value);
            formData.append('prix_achat', document.getElementById('prix_achat').value);
            formData.append('prix_vente', document.getElementById('prix_vente').value);
            
            const imageFile = document.getElementById('image').files[0];
            if (imageFile) {
                formData.append('image', imageFile);
            }
            
            try {
                const response = await fetch('http://localhost:3000/api/produits', {
                    method: 'POST',
                    body: formData
                });
                
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.className = 'result success';
                    resultDiv.innerHTML = `
                        <h3>Succès!</h3>
                        <p>Produit créé avec ID: ${data.id_produit}</p>
                        <p>Code: ${data.code_produit}</p>
                        <p>Nom: ${data.nom}</p>
                        ${data.image_url ? `<p>Image URL: ${data.image_url}</p>
                        <img src="http://localhost:3000${data.image_url}" alt="Produit" class="image-preview">` : ''}
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.className = 'result error';
                    resultDiv.innerHTML = `
                        <h3>Erreur!</h3>
                        <p>${error.error || 'Erreur inconnue'}</p>
                    `;
                }
            } catch (error) {
                const resultDiv = document.getElementById('result');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `
                    <h3>Erreur!</h3>
                    <p>${error.message}</p>
                `;
            }
        });
    </script>
</body>
</html>
